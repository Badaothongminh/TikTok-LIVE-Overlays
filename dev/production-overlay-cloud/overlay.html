<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EulerStream Overlay Local Test</title>
  <link rel="stylesheet" href="./overlay.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #overlay-root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div id="overlay-root"></div>

  <div id="comment-notification" style="
    display: none;
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    max-width: 900px;
    padding: 18px 28px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.78);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 32px;
    line-height: 1.3;
    text-align: center;
    z-index: 9999;
  ">
    <div id="comment-user" style="font-weight: bold;"></div>
    <div id="comment-text"></div>
  </div>

  <div id="like-notification" style="
    display: none;
    position: fixed;
    right: 40px;
    bottom: 100px;
    max-width: 500px;
    padding: 18px 24px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.78);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    z-index: 9999;
  ">
    <img id="like-avatar" style="
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 14px;
    ">
    <span id="like-text" style="
      font-size: 30px;
      vertical-align: middle;
    "></span>
  </div>

  <div id="follow-notification" style="
    display: none;
    position: fixed;
    left: 40px;
    bottom: 100px;
    max-width: 550px;
    padding: 18px 24px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.78);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    z-index: 9999;
  ">
    <img id="follow-avatar" style="
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 14px;
    ">
    <span id="follow-text" style="
      font-size: 30px;
      vertical-align: middle;
    "></span>
  </div>

  <div id="gift-notification" style="
    display: none;
    position: fixed;
    right: 40px;
    top: 100px;
    max-width: 600px;
    padding: 18px 24px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.82);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    z-index: 9999;
  ">
    <img id="gift-avatar" style="
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 14px;
    ">
    <span id="gift-text" style="
      font-size: 30px;
      vertical-align: middle;
    "></span>
  </div>

  <script src="./overlay.js"></script>

  <script>
    const listeners = new Set();

    window.Overlay.mount(
      document.getElementById("overlay-root"),
      {
        config: {
          fadeIn: 500,
          fadeOut: 500,
          displayTime: 3000,
          fontSize: 48,
          imageSize: 200
        },

        subscribeToEvents(callback) {
          listeners.add(callback);

          return () => {
            listeners.delete(callback);
          };
        }
      }
    );

    const overlayToken =
      new URLSearchParams(window.location.search).get("token");

    const eventsUrl = overlayToken
      ? `/events?token=${encodeURIComponent(overlayToken)}`
      : "/events";

    const events = new EventSource(eventsUrl);

    events.onopen = () => {
      console.log("Local event relay connected.");
    };

    events.onmessage = (event) => {
      try {
        const message = JSON.parse(event.data);

        for (const callback of listeners) {
          callback(message.eventName, message.data);
        }

        if (message.eventName === "WebcastMemberMessage") {
          console.log(
            "JOIN received:",
            message.data?.user?.uniqueId,
            "|",
            message.data?.user?.nickname
          );
        }

        if (message.eventName === "WebcastSocialMessage") {
          console.log(
            "BROWSER SOCIAL DIAGNOSTIC:",
            "eventName =", message.eventName,
            "| displayType =", message.data?.common?.displayText?.displayType,
            "| uniqueId =", message.data?.user?.uniqueId
          );
        }

        if (
          message.eventName === "DISABLED_LEGACY_WebcastSocialMessage" && message.data?.common?.displayText?.displayType === "pm_main_follow_message_viewer_2"
        ) {
          const notification = document.getElementById("follow-notification");
          const avatar = document.getElementById("follow-avatar");
          const text = document.getElementById("follow-text");

          const nickname =
            message.data?.user?.nickname ||
            message.data?.user?.uniqueId ||
            "Viewer";

          const avatarUrl =
            message.data?.user?.profilePicture?.url?.[0];

          text.textContent = `${nickname} followed ❤️`;

          if (avatarUrl) {
            avatar.src = avatarUrl;
            avatar.style.display = "inline-block";
          } else {
            avatar.removeAttribute("src");
            avatar.style.display = "none";
          }

          notification.style.display = "block";

          clearTimeout(window.followHideTimer);

          window.followHideTimer = setTimeout(() => {
            notification.style.display = "none";
          }, 4000);

          console.log(
            "FOLLOW visual:",
            message.data?.user?.uniqueId,
            "|",
            nickname
          );
        }

        if (message.eventName === "DISABLED_LEGACY_WebcastGiftMessage") {
          const notification = document.getElementById("gift-notification");
          const avatar = document.getElementById("gift-avatar");
          const text = document.getElementById("gift-text");

          const nickname =
            message.data?.user?.nickname ||
            message.data?.user?.uniqueId ||
            "Viewer";

          const giftName =
            message.data?.giftDetails?.giftName ||
            message.data?.giftDetails?.name ||
            "Gift";

          const quantity =
            message.data?.repeatCount ??
            message.data?.groupCount ??
            1;

          const coinValue =
            message.data?.giftDetails?.diamondCount ??
            0;

          const avatarUrl =
            message.data?.user?.profilePicture?.url?.[0];

          text.textContent =
            `${nickname} sent ${giftName} ×${quantity} 🪙 ${coinValue} Coin`;

          if (avatarUrl) {
            avatar.src = avatarUrl;
            avatar.style.display = "inline-block";
          } else {
            avatar.removeAttribute("src");
            avatar.style.display = "none";
          }

          notification.style.display = "block";

          clearTimeout(window.giftHideTimer);

          window.giftHideTimer = setTimeout(() => {
            notification.style.display = "none";
          }, 5000);

          console.log(
            "GIFT visual:",
            message.data?.user?.uniqueId,
            "|",
            giftName,
            "| ×",
            quantity,
            "|",
            coinValue,
            "Coin"
          );
        }

        if (message.eventName === "DISABLED_LEGACY_WebcastLikeMessage") {
          const notification = document.getElementById("like-notification");
          const avatar = document.getElementById("like-avatar");
          const text = document.getElementById("like-text");

          const nickname =
            message.data?.user?.nickname ||
            message.data?.user?.uniqueId ||
            "Viewer";

          const likeCount = message.data?.likeCount ?? 0;
          const avatarUrl = message.data?.user?.profilePicture?.url?.[0];

          text.textContent = `${nickname}  +${likeCount} ❤️`;

          if (avatarUrl) {
            avatar.src = avatarUrl;
            avatar.style.display = "inline-block";
          } else {
            avatar.removeAttribute("src");
            avatar.style.display = "none";
          }

          notification.style.display = "block";

          clearTimeout(window.likeHideTimer);

          window.likeHideTimer = setTimeout(() => {
            notification.style.display = "none";
          }, 4000);

          console.log(
            "LIKE visual:",
            message.data?.user?.uniqueId,
            "| +",
            likeCount,
            "| total",
            message.data?.totalLikeCount
          );
        }

        if (message.eventName === "DISABLED_LEGACY_WebcastChatMessage") {
          const notification = document.getElementById("comment-notification");
          const user = document.getElementById("comment-user");
          const text = document.getElementById("comment-text");

          user.textContent =
            message.data?.user?.nickname ||
            message.data?.user?.uniqueId ||
            "Viewer";

          text.textContent = message.data?.comment || "";

          notification.style.display = "block";

          clearTimeout(window.commentHideTimer);

          window.commentHideTimer = setTimeout(() => {
            notification.style.display = "none";
          }, 4000);

          console.log(
            "COMMENT visual:",
            message.data?.user?.uniqueId,
            "|",
            message.data?.comment
          );
        }
      } catch (error) {
        console.error("Event relay parse error:", error);
      }
    };

    events.onerror = () => {
      console.error("Local event relay disconnected.");
    };

    console.log("Overlay mounted. Waiting for real TikTok LIVE events...");
  </script>
</body>
</html>
